<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот поддержки | 3DPrintPro</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-print"></i>3DPrintPro
            </a>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="/"><i class="fas fa-home"></i> Главная</a></li>
                    <li class="nav-item"><a href="/support/"><i class="fas fa-headset"></i> Поддержка</a></li>
                    <li class="nav-item"><a href="/profile/"><i class="fas fa-user"></i> Профиль</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-header">Ассистент 3DPrintPro</div>
        <div class="chat-messages">
            <div class="bot-message message">Здравствуйте! Я виртуальный помощник 3DPrintPro. Чем могу помочь? Задавайте вопросы о принтерах, ценах, доставке или технических характеристиках.</div>
        </div>
        <form id="chat-form" class="chat-form">
            {% csrf_token %}
            <input type="text" id="user-input" class="chat-input" placeholder="Введите ваш вопрос..." autocomplete="off" required>
            <button type="submit" class="btn btn-success">Отправить</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const chatMessages = document.getElementById('chat-messages');

            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }

            function addMessage(text, className) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${className}`;
                messageDiv.textContent = text;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            chatForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const message = userInput.value.trim();

                if (message) {
                    addMessage(message, 'user-message');
                    userInput.value = '';

                    // Show typing indicator
                    const typingIndicator = document.createElement('div');
                    typingIndicator.className = 'typing-indicator';
                    typingIndicator.textContent = 'Ассистент печатает...';
                    chatMessages.appendChild(typingIndicator);
                    chatMessages.scrollTop = chatMessages.scrollHeight;

                    try {
                        const formData = new URLSearchParams();
                        formData.append('message', message);
                        formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));

                        const response = await fetch('/chat/api/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const data = await response.json();
                        chatMessages.removeChild(typingIndicator);

                        if (data.response) {
                            addMessage(data.response, 'bot-message');
                        } else if (data.error) {
                            addMessage("Извините, произошла ошибка.", 'bot-message');
                            console.error(data.error);
                        }
                    } catch (error) {
                        chatMessages.removeChild(typingIndicator);
                        addMessage("Извините, возникла проблема с соединением.", 'bot-message');
                        console.error('Error:', error);
                    }
                }
            });
        });
    </script>
</body>
</html>
