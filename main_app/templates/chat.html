{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Website Assistant</title>
    <style>
        #chat-container {
            max-width: 600px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #chat-header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            font-size: 18px;
        }
        #chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background-color: #f9f9f9;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            line-height: 1.4;
            max-width: 70%;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: auto;
            border-radius: 18px 18px 5px 18px;
        }
        .bot-message {
            background-color: #f1f1f1;
            margin-right: auto;
            border-radius: 18px 18px 18px 5px;
        }
        .typing-indicator {
            color: #999;
            font-style: italic;
            padding: 5px 15px;
        }
        #chat-form {
            display: flex;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }
        #chat-form button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #chat-form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-header">Website Assistant</div>
        <div id="chat-messages">
            <div class="bot-message message">Hello! How can I help you today?</div>
        </div>
        <form id="chat-form">
            {% csrf_token %}
            <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const chatMessages = document.getElementById('chat-messages');

            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }

            function addMessage(text, className) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${className}`;
                messageDiv.textContent = text;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            chatForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const message = userInput.value.trim();

                if (message) {
                    addMessage(message, 'user-message');
                    userInput.value = '';

                    // Show typing indicator
                    const typingIndicator = document.createElement('div');
                    typingIndicator.className = 'typing-indicator';
                    typingIndicator.textContent = 'Assistant is typing...';
                    chatMessages.appendChild(typingIndicator);
                    chatMessages.scrollTop = chatMessages.scrollHeight;

                    try {
                        const formData = new URLSearchParams();
                        formData.append('message', message);
                        formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));

                        const response = await fetch('/chat/api/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const data = await response.json();
                        chatMessages.removeChild(typingIndicator);

                        if (data.response) {
                            addMessage(data.response, 'bot-message');
                        } else if (data.error) {
                            addMessage("Sorry, I encountered an error.", 'bot-message');
                            console.error(data.error);
                        }
                    } catch (error) {
                        chatMessages.removeChild(typingIndicator);
                        addMessage("Sorry, there was a connection problem.", 'bot-message');
                        console.error('Error:', error);
                    }
                }
            });
        });
    </script>
</body>
</html>
