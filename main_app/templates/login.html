<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        /* Основные стили для анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Темная тема */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation: fadeIn 0.8s ease-out; /* Анимация для плавного появления страницы */
        }

        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards; /* Анимация для заголовка */
            animation-delay: 0.2s; /* Задержка для заголовка */
        }

        .form-group {
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards; /* Анимация для элементов формы */
        }

        /* Задержки для каждого элемента формы */
        .form-group:nth-child(1) { animation-delay: 0.4s; }
        .form-group:nth-child(2) { animation-delay: 0.6s; }

        label {
            display: block;
            margin-bottom: 5px;
            color: #bbbbbb;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #333;
            color: #ffffff;
            font-size: 16px;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #555;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #444;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards; /* Анимация для кнопки */
            animation-delay: 0.8s; /* Задержка для кнопки */
        }

        button:hover {
            background-color: #555;
        }

        .error-message, .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
        }

        a {
            color: #1e90ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p {
            margin: 10px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards; /* Анимация для текста */
            animation-delay: 1s; /* Задержка для текста */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Вход</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                {{ form.password }}
            </div>

            <button type="submit">Войти</button>

            {% if messages %}
                <div class="error-message">
                    {% for message in messages %}
                        {{ message }}<br>
                    {% endfor %}
                </div>
            {% endif %}
        </form>

        <p>Нет аккаунта? <a href="/accounts/registrate/">Зарегистрироваться</a></p>
        <p><a href="/accounts/password_reset/">Забыли пароль?</a></p>
    </div>

    {% if form.non_field_errors %}
        <div class="error">{{ form.non_field_errors }}</div>
    {% endif %}
</body>
</html>
