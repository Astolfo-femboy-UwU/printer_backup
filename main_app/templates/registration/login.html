{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в 3DPrintPro</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-bg">
    <div class="auth-container">
        <h1 class="auth-title"><i class="fas fa-sign-in-alt"></i> Вход</h1>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Имя пользователя</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Пароль</label>
                {{ form.password }}
            </div>

            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {% for error in form.non_field_errors %}
                        {{ error }}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" class="btn btn-primary mt-3">Войти в систему</button>
        </form>

        <div class="auth-links">
            <p>Нет аккаунта? <a href="/accounts/registration/">Создать аккаунт</a></p>
            <p><a href="/accounts/password_reset/"><i class="fas fa-key"></i> Восстановить пароль</a></p>
        </div>
    </div>
</body>
</html>
