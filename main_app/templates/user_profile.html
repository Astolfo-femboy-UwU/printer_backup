<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
</head>
<body>
    <div class="profile">
        <h2>Информация о пользователе</h2>
        <p><strong>Имя пользователя:</strong> {{ profile.user.username }}</p>
        <p><strong>Имя:</strong> {{ profile.user.first_name }}</p>
        <p><strong>Фамилия:</strong> {{ profile.user.last_name }}</p>
        <p><strong>Электронная почта:</strong> {{ profile.user.email }}</p>
    </div>
<p><a href="/edit_profile/">Изменить профиль</a></p>
<p><a href="/">На главную страницу</a></p>
</body>
</html>
